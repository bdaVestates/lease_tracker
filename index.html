<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vestates Tenant Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vault template — floating top bar + slim icon rail, re-flowing card grid; cool-grey ground, Vestates blue accent with green for healthy states */
:root{
  --bg:#F3F6FD; --surface:#FFFFFF; --surface-2:#EEF3FC; --line:#E1E8F4;
  --ink:#0B1530; --ink-2:#47557A; --ink-3:#8793AE;
  --accent:#2F6BFF; --accent-2:#1EC2F0; --accent-soft:#E5EDFF;
  --green:#12B76A; --good:#0B9B59; --good-soft:#DCF7EA; --bad:#F0446A; --bad-soft:#FEE7ED; --warn:#E08600; --warn-soft:#FFF1D6; --amber:#FFAE1A; --violet:#8B5CF6;
  --pill:#0B1530; --on-pill:#FFFFFF; --shadow:0 1px 2px rgba(20,40,90,.05),0 10px 30px -14px rgba(30,60,140,.18);
  --grad:linear-gradient(120deg,#2F6BFF 0%,#1EC2F0 55%,#12B76A 100%);
  --f-sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Bricolage Grotesque","Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B18; --surface:#101729; --surface-2:#172038; --line:#233050;
  --ink:#F2F5FF; --ink-2:#A9B4D0; --ink-3:#6D7A9C;
  --accent:#5C8DFF; --accent-2:#3AD6FA; --accent-soft:#16244A;
  --green:#2EE59D; --good:#2EE59D; --good-soft:#0F2E24; --bad:#FF6B8B; --bad-soft:#3A1622; --warn:#FFC24D; --warn-soft:#33270E; --amber:#FFC24D; --violet:#A78BFA;
  --pill:#F2F5FF; --on-pill:#0B1530; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B18; --surface:#101729; --surface-2:#172038; --line:#233050;
  --ink:#F2F5FF; --ink-2:#A9B4D0; --ink-3:#6D7A9C;
  --accent:#5C8DFF; --accent-2:#3AD6FA; --accent-soft:#16244A;
  --green:#2EE59D; --good:#2EE59D; --good-soft:#0F2E24; --bad:#FF6B8B; --bad-soft:#3A1622; --warn:#FFC24D; --warn-soft:#33270E; --amber:#FFC24D; --violet:#A78BFA;
  --pill:#F2F5FF; --on-pill:#0B1530; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:radial-gradient(1100px 620px at 8% -12%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),radial-gradient(900px 520px at 100% -4%,color-mix(in srgb,var(--accent-2) 18%,transparent),transparent 60%),radial-gradient(900px 700px at 60% 115%,color-mix(in srgb,var(--green) 12%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
#prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;transform-origin:left;transform:scaleX(0);background:var(--grad);z-index:90;pointer-events:none}
.head h1,.big,.mid,.ring-c b,.rw b,.hero-copy h2,.hero-kpis b,.drawer h3,.brand .bname,.card-t,.facc h4,.tcard h4{font-family:var(--f-display)}
.head h1{background:linear-gradient(100deg,var(--ink) 35%,var(--accent) 78%,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.card-t{font-size:14px;letter-spacing:-.01em}
/* scroll reveal */
.sr{opacity:0;transform:translateY(30px) scale(.985);filter:blur(8px);transition:opacity .85s cubic-bezier(.2,.8,.2,1),transform .85s cubic-bezier(.2,.8,.2,1),filter .85s;transition-delay:var(--d,0ms)}
tr.sr{transform:translateX(-18px);filter:none}
.sr.in{opacity:1;transform:none;filter:none}
.sr.in.tilt{transition:opacity .85s,filter .85s,transform .18s ease-out;transition-delay:var(--d,0ms),var(--d,0ms),0ms}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;border-radius:999px;transition:background .3s,box-shadow .3s,padding .3s,margin .3s}
.top.scrolled{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--shadow);padding:6px;margin-inline:-6px}
.top.scrolled .brand,.top.scrolled .tabs,.top.scrolled .icons,.top.scrolled .user{box-shadow:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
svg.lucide{width:16px;height:16px;stroke-width:1.9}
.app{max-width:1440px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);padding:6px 16px 6px 6px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-9px;height:14px;border-radius:50%;background:var(--green);opacity:.95}
.brand-mark svg{position:relative;z-index:1;width:15px;height:15px;margin-top:-4px}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);line-height:1}
.tabs-wrap{justify-self:center;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{position:relative;display:flex;gap:2px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow);width:max-content}
.tab{position:relative;z-index:1;padding:7px 15px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13px;transition:color .25s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:#fff}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--grad);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
.actions{display:flex;align-items:center;gap:10px}
.icons{display:flex;gap:2px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow);position:relative}
.ibtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative;transition:background .2s,color .2s}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.user{display:flex;align-items:center;gap:9px;background:var(--surface);padding:5px 12px 5px 5px;border-radius:999px;box-shadow:var(--shadow)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11.5px;color:#fff;flex:none;letter-spacing:.02em}
.user b{display:block;font-size:12.5px;font-weight:600;line-height:1.1}
.user small{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--ink-3)}
.sync::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:5px;vertical-align:1px}
.sync.ok::before{background:var(--good)}.sync.busy::before{background:var(--amber)}.sync.err::before{background:var(--bad)}

/* rail */
.body{display:grid;grid-template-columns:44px minmax(0,1fr);gap:22px;margin-top:22px}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
.rail-group{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.rbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:background .25s,color .25s}
.rbtn:hover{color:var(--ink);background:var(--surface-2)}
.rbtn.on{background:var(--grad);color:#fff}

/* head + buttons */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:clamp(32px,4.2vw,48px);font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.1;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:500;font-size:13px;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn-dark:hover{opacity:.88}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* cards */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.lift:hover{transform:translateY(-4px);box-shadow:var(--shadow),0 18px 32px -18px rgba(17,24,39,.25)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-t{font-size:13px;font-weight:600}
.card-s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.big{font-size:clamp(26px,2.6vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1.15}
.mid{font-size:21px;font-weight:600;letter-spacing:-.025em}
.muted{color:var(--ink-3);font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}

/* motion */
.rv{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.still .rv{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.bar-g{transform-origin:left}
.sr:not(.in) .bar-g,.hbar.sr:not(.in) i{transform:scaleX(0)}
.sr.in .bar-g{animation:growx 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(150ms + var(--j,0) * 40ms)}
@keyframes growx{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){.sr{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}.hero::before{animation:none}.rv,.bar-g{animation:none}.tab-ind,.ring-fg,.fill{transition:none!important}}

/* overview */
.g-over{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.15fr)}
.g-over .wide{grid-column:span 2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;color:inherit}
.stats>.stat:nth-child(2){background:linear-gradient(160deg,var(--surface) 40%,color-mix(in srgb,var(--green) 12%,var(--surface)))}
.stats>.stat:nth-child(3){background:linear-gradient(160deg,var(--surface) 40%,color-mix(in srgb,var(--violet) 12%,var(--surface)))}
.stats>.stat:nth-child(4){background:linear-gradient(160deg,var(--surface) 40%,color-mix(in srgb,var(--amber) 16%,var(--surface)))}
.stats>.stat:nth-child(2) .ic{background:var(--good-soft);color:var(--good)}
.stats>.stat:nth-child(3) .ic{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.stats>.stat:nth-child(4) .ic{background:var(--warn-soft);color:var(--warn)}
.stat-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-3)}
.stat .ic{width:24px;height:24px;border-radius:8px}
.stat.hot{background:linear-gradient(140deg,#2F6BFF,#1EC2F0 70%,#12B76A 130%);color:#fff;position:relative;overflow:hidden}
.stat.hot .stat-top,.stat.hot .muted{color:rgba(255,255,255,.85)}
.stat.hot .ic{background:rgba(255,255,255,.2);color:#fff}
.stat.hot::before{content:"";position:absolute;right:-34px;bottom:-46px;width:140px;height:80px;border-radius:50%;background:var(--green);opacity:.55}
.occ-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--surface-2)} .ring-fg{stroke:var(--accent);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1}
.ring-c small{font-size:10px;color:var(--ink-3)}
.mix{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.mix-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.mix-row i{width:10px;height:10px;border-radius:3px}
.split{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-top:14px}
.split span{display:block;height:100%}
.runway{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rw{background:var(--surface-2);border-radius:var(--r-md);padding:12px;text-align:left;position:relative;overflow:hidden;transition:background .2s,transform .2s}
.rw:hover{transform:translateY(-2px);background:var(--line)}
.rw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.rw b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--c)}
.rw span{font-size:11.5px;color:var(--ink-2)}
.rw small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:12px;cursor:pointer;border-radius:8px}
.hbar:hover .nm{color:var(--accent)}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:inherit;background:var(--grad)}
.hbar .v{font-weight:600;font-size:12px;min-width:64px;text-align:right}

/* tables */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:6px 12px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:none;width:170px;font-size:12.5px;color:var(--ink)}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sel{background:var(--surface-2);border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--ink);max-width:220px}
.table-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11.5px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:220px}
.who b{display:block;font-weight:600;font-size:12.5px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--ink-3);font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .avatar{width:32px;height:32px;font-size:11px}
.fac{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fac i{width:8px;height:8px;border-radius:50%;flex:none}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:999px;font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;transition:background .2s,color .2s}
.seg button.on{background:var(--grad);color:#fff}
.seg button small{font-size:10px;opacity:.7}
.count-line{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-size:12px;color:var(--ink-3)}

/* tenant cards */
.tcards{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tcard{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;position:relative}
.tcard .avatar{width:44px;height:44px;font-size:13px;margin-bottom:4px}
.tcard h4{margin:0;font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tcard .st{position:absolute;top:16px;right:16px}
.tcard .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.copy{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);padding:2px 0}
.copy svg.lucide{width:12px;height:12px}

/* facilities */
.facs{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.facc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer}
.facc .ftop{display:flex;justify-content:space-between;width:100%;align-items:center}
.facc .ring{width:100px;height:100px;margin:4px 0}
.facc h4{margin:0;font-size:13.5px;font-weight:600}
.facc .meta{display:flex;justify-content:space-between;width:100%;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.facc .meta b{display:block;color:var(--ink);font-size:13px}

/* renewals */
.g-two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rsel{background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:5px 10px;font-size:12px}
.rsel.talks{border-color:var(--warn);color:var(--warn)}
.rsel.renewed{border-color:var(--good);color:var(--good)}
.rsel.leaving{border-color:var(--bad);color:var(--bad)}
.days{font-weight:600;font-size:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);backdrop-filter:blur(4px);display:flex;justify-content:flex-end;z-index:60;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(22px + env(safe-area-inset-top,0px));animation:slide .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer h3{margin:0;font-size:20px;letter-spacing:-.02em}
.dhead{display:flex;gap:12px;align-items:center}
.dhead .avatar{width:48px;height:48px;font-size:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;outline:none;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field small{color:var(--ink-3);font-size:11px}
.sect{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);grid-column:1/-1;margin-top:6px}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
.dfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.ro .w-only{display:none!important}

/* toast, pop, tip */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--pill);color:var(--on-pill);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.5,1);z-index:70;max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:330px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:var(--r-md);box-shadow:0 20px 50px -20px rgba(0,0,0,.35),0 0 0 1px var(--line);padding:8px;z-index:30;animation:rise .35s cubic-bezier(.2,.8,.2,1);max-height:420px;overflow:auto}
.pop h5{margin:6px 8px;font-size:12px}
.note{display:flex;gap:10px;padding:8px;border-radius:10px;font-size:12px;cursor:pointer;width:100%;text-align:left}
.note:hover{background:var(--surface-2)}
.note small{display:block;color:var(--ink-3);font-size:11px}
.skel{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* 3D hero */
.hero{position:relative;height:400px;padding:0;overflow:hidden;margin-bottom:16px;background:radial-gradient(90% 120% at 90% 0%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 60%),radial-gradient(80% 120% at 0% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),var(--surface)}
.hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:38%;top:-160px;background:radial-gradient(circle,color-mix(in srgb,var(--green) 22%,transparent),transparent 65%);filter:blur(20px);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(120px,60px) scale(1.15)}}
#scene3d{position:absolute;inset:0;cursor:grab;touch-action:pan-y}
#scene3d.drag{cursor:grabbing}
#scene3d canvas{display:block;width:100%!important;height:100%!important}
.hero-copy{position:absolute;left:24px;top:22px;z-index:2;pointer-events:none;max-width:300px}
.hero-copy .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero-copy h2{margin:6px 0 14px;font-size:clamp(22px,2.4vw,28px);letter-spacing:-.03em;line-height:1.15;font-weight:600;text-wrap:balance}
.hero-kpis{display:flex;gap:22px}
.hero-kpis b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em}
.hero-kpis span{font-size:11.5px;color:var(--ink-3)}
.legend3d{position:absolute;left:24px;bottom:18px;z-index:2;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);pointer-events:none}
.legend3d span{display:inline-flex;align-items:center;gap:6px}
.legend3d i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hint3d{position:absolute;right:18px;bottom:16px;z-index:2;font-size:11px;color:var(--ink-3);pointer-events:none;display:flex;align-items:center;gap:6px}
.tip3d{position:absolute;z-index:3;pointer-events:none;background:var(--pill);color:var(--on-pill);font-size:12px;padding:8px 11px;border-radius:12px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s;white-space:nowrap;line-height:1.35}
.tip3d.show{opacity:1}
.tip3d small{display:block;opacity:.7;font-size:11px}
.tilt{transform-style:preserve-3d;will-change:transform}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 40%);opacity:0;transition:opacity .3s;pointer-events:none}
.shine:hover::after{opacity:1}
@media (max-width:720px){.hero{height:420px}.hero-copy{left:16px;top:16px;right:16px}.legend3d{left:16px;bottom:12px}.hint3d{display:none}}

/* responsive */
@media (max-width:1180px){
  .g-over{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .g-over .wide{grid-column:span 2}
  .tcards,.facs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .runway{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .top{grid-template-columns:auto auto;justify-content:space-between}
  .tabs-wrap{grid-column:1 / -1;grid-row:2;justify-self:stretch}
  .tabs{margin:0 auto}
  .user .uname{display:none}
  .g-two{grid-template-columns:minmax(0,1fr)}
  .tcards,.facs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .g-over{grid-template-columns:minmax(0,1fr)}
  .g-over .wide{grid-column:auto}
  .runway{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fields{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){
  .brand .bname{display:none}
  .brand{padding:6px}
  .tcards,.facs{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .search input{width:120px}
}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>

<div id="prog"></div>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/></svg></span><span class="bname">Vestates<small>Tenant registry</small></span></div>
    <div class="tabs-wrap"><nav class="tabs" id="tabs" aria-label="Sections"><span class="tab-ind" id="ind"></span></nav></div>
    <div class="actions">
      <div class="icons">
        <button class="ibtn" id="btnSearch" aria-label="Find a tenant"><i data-lucide="search"></i></button>
        <button class="ibtn" id="btnBell" aria-label="Lease alerts"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></button>
        <button class="ibtn" id="btnTheme2" aria-label="Toggle theme"><i data-lucide="sun-moon"></i></button>
        <div id="popHost"></div>
      </div>
      <div class="user">
        <span class="avatar" id="meAv" style="background:linear-gradient(140deg,#3E7BE6,#1F4FB4)">V</span>
        <span class="uname"><b id="meName">Facilities team</b><small><span class="sync" id="sync">Connecting…</span></small></span>
      </div>
    </div>
  </header>
  <div class="body">
    <aside class="rail">
      <div class="rail-group">
        <button class="rbtn" data-theme-set="light" aria-label="Light theme"><i data-lucide="sun"></i></button>
        <button class="rbtn" data-theme-set="dark" aria-label="Dark theme"><i data-lucide="moon"></i></button>
      </div>
      <div class="rail-group" id="railNav"></div>
      <div class="rail-group w-only">
        <button class="rbtn" data-new="1" aria-label="Add tenant"><i data-lucide="user-plus"></i></button>
        <button class="rbtn" id="btnExport" aria-label="Export CSV"><i data-lucide="download"></i></button>
        <button class="rbtn" id="btnSignOut" aria-label="Sign out" hidden><i data-lucide="log-out"></i></button>
      </div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
/* ===== Firebase settings =====
   Paste the config from Firebase console → Project settings → Your apps → Web app.
   Use the SAME project as the lease dashboard: the registry reads and edits the
   dashboard's own data (units, config) and uses its team list (members) for access. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAigN3H-sls_BriSwtnC1quELnUGxLp1Y8",
  authDomain: "lease-dashboard-302be.firebaseapp.com",
  projectId: "lease-dashboard-302be",
  storageBucket: "lease-dashboard-302be.firebasestorage.app",
  messagingSenderId: "20481569999",
  appId: "1:20481569999:web:0a0b5b9a97c196d3bd33ba"
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const AREAS={'Takum Towers':'Wuse 2','Kingstown, 43 Sultan Drive':'Lifecamp','XII Lungi':'Wuse 2','Venus':'Maitama','Anchorage Hills':'Asokoro','Brains and Hammers':'Lifecamp','Hills':'Maitama','April':'Jabi','Bauhaus':'Guzape','Valley':'Asokoro','Niche':'Garki 2','Stazia Court':'Maitama','Seven by Vestates (Libreville Cres.)':'Wuse 2','12 Baba Umar Faruk II Cres., Jahi':'Jahi','Tranquillo':'Asokoro','7-Fifteen':'Lakeside Estate, Jabi'};
const STATUS={occupied:'Occupied',vacant:'Vacant',vacated:'Vacated',not_managed:'Not managed'};
const TYPES=['Individual','Company','Embassy'];
const TYPE_COL={Individual:'var(--accent)',Company:'var(--green)',Embassy:'var(--amber)'};
const PAGES=[{k:'overview',t:'Overview',i:'layout-grid'},{k:'tenants',t:'Tenants',i:'users'},{k:'facilities',t:'Facilities',i:'building-2'},{k:'renewals',t:'Renewals',i:'calendar-clock'},{k:'reports',t:'Reports',i:'file-bar-chart'}];
const S={page:'overview',rows:[],props:[],colors:{},loaded:{t:false,c:false},offline:false,canWrite:true,
  q:'',fac:'all',st:'all',ty:'all',bucket:'all',view:'table',animate:true};
let DB=null,DL=null,pendingRender=false,writing=0,lastErr='';
let COL_T='tenants',DOC_C='config/main',FB=false,UNSUB=[];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=(v,dec=0)=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const short=v=>{v=v||0;const a=Math.abs(v);return '₦'+(a>=1e9?(v/1e9).toFixed(2)+'bn':a>=1e6?(v/1e6).toFixed(1)+'m':a>=1e3?Math.round(v/1e3)+'k':Math.round(v))};
const title=s=>String(s||'').toLowerCase().replace(/(^|[\s(\/\-.&])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const ini=n=>{const w=String(n||'?').replace(/[^A-Za-z ]/g,' ').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase()};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function icons(){try{lucide.createIcons()}catch(e){}}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function fdate(s){const d=pd(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—'}
function daysLeft(t){const e=pd(t.end);return e?Math.round((e-today())/864e5):null}
function termMonths(t){const s=pd(t.start),e=pd(t.end);if(!s||!e||e<s)return null;return Math.round(((e-s)/864e5+1)/30.4375)}
function years(t){if(t.status!=='occupied'||t.billing==='monthly')return 1;const m=termMonths(t);if(m===null)return 1;const y=Math.round(m/12);return y>=2?y:1}
function annual(t){return t.status==='occupied'?(t.rent||0)/years(t):0}
function annualSc(t){return t.status==='occupied'?(t.sc||0)/years(t):0}
function bucket(t){
  if(t.status!=='occupied')return null;
  if(t.billing==='monthly'||!t.end)return 'open';
  const d=daysLeft(t);
  if(t.renewal==='Renewed'&&d<=90)return 'renewed';
  return d<0?'expired':d<=30?'d30':d<=60?'d60':d<=90?'d90':'later';
}
const BUCKETS=[['expired','Expired','var(--bad)','Past end date, not renewed'],['d30','0–30 days','var(--bad)','Ending this month'],['d60','31–60 days','var(--warn)','Start talks now'],['d90','61–90 days','var(--amber)','Plan ahead'],['later','90+ days','var(--good)','Secure for now']];
function facColor(p){return S.colors[p]||'#8892A6'}
function facName(p){return String(p||'Unassigned').replace(/, 43 Sultan Drive/,'').replace(/ \(Libreville Cres\.\)/,'').replace(/^12 Baba Umar Faruk II Cres\., /,'')}
function tenantName(t){return t.tenant?title(t.tenant):(t.status==='vacant'?'Vacant unit':t.status==='not_managed'?'Not managed':'Unnamed')}
function unitName(t){return t.unit?title(t.unit):'Unit not named'}
function avatar(t,size){const g=t.status==='occupied'?`linear-gradient(140deg,${facColor(t.property)},color-mix(in srgb,${facColor(t.property)} 60%,#000))`:'var(--surface-2)';return `<span class="avatar" style="background:${g};${t.status!=='occupied'?'color:var(--ink-3);border:1.5px dashed var(--line);':''}${size?`width:${size}px;height:${size}px`:''}">${t.status==='occupied'?esc(ini(t.tenant)):'<i data-lucide="door-open" style="width:14px;height:14px"></i>'}</span>`}
function statusChip(t){
  if(t.status!=='occupied')return `<span class="chip ${t.status==='vacated'?'warn':''}">${STATUS[t.status]||t.status}</span>`;
  const b=bucket(t),d=daysLeft(t);
  if(b==='open')return '<span class="chip blue">Monthly</span>';
  if(b==='renewed')return '<span class="chip good">Renewed</span>';
  if(b==='expired')return `<span class="chip bad">Expired ${-d}d ago</span>`;
  if(b==='d30')return `<span class="chip bad">${d}d left</span>`;
  if(b==='d60'||b==='d90')return `<span class="chip warn">${d}d left</span>`;
  return '<span class="chip good">Active</span>';
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function facilities(){const set=[...S.props];S.rows.forEach(r=>{if(r.property&&!set.includes(r.property))set.push(r.property)});return set}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function setSync(){const el=$('#sync');let t,c='sync';
  if(S.needAuth){t='Signed out'}else if(S.offline){t='Data unavailable';c+=' err'}else if(!S.loaded.t){t='Loading…';c+=' busy'}else if(!S.canWrite){t='View only'}else if(writing){t='Saving…';c+=' busy'}else if(lastErr){t=lastErr;c+=' err'}else{t='Saved for everyone';c+=' ok'}
  el.className=c;el.textContent=t}

/* ---------- nav ---------- */
function buildNav(){
  PAGES.forEach(p=>{const b=document.createElement('button');b.className='tab';b.textContent=p.t;b.dataset.go=p.k;$('#tabs').appendChild(b)});
  $('#railNav').innerHTML=PAGES.map(p=>`<button class="rbtn" data-go="${p.k}" aria-label="${p.t}"><i data-lucide="${p.i}"></i></button>`).join('');
}
function moveInd(){const a=document.querySelector('.tab[aria-current="page"]'),ind=$('#ind');if(!a)return;ind.style.width=a.offsetWidth+'px';ind.style.transform=`translateX(${a.offsetLeft}px)`}
function go(k,o={}){
  S.page=k;S.animate=true;
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.go===k)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  document.querySelectorAll('#railNav .rbtn').forEach(b=>b.classList.toggle('on',b.dataset.go===k));
  moveInd();render();
  try{history.replaceState(null,'','#'+k)}catch(e){}
  if(!o.noScroll)window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- views ---------- */
const head=(t,p,btn='')=>`<div class="head rv" style="--i:0"><div><h1>${t}</h1><p>${p}</p></div>${btn}</div>`;
function loadingView(){return head('Tenant registry','Loading tenant records…')+`<div class="g-over">${'<div class="skel"></div>'.repeat(6)}</div>`}
function offlineView(){return head('Tenant registry','')+`<section class="card"><div class="empty"><b style="color:var(--ink)">Tenant data isn't available.</b><br>${esc(S.offlineMsg||'Check your connection and reload the page.')}</div></section>`}
function verifyView(){return `<div style="max-width:440px;margin:40px auto"><section class="card rv" style="padding:26px"><h3 style="margin:0 0 6px;font-family:var(--f-display);font-size:22px">Confirm your email</h3><p class="muted" style="font-size:13px">For security, confirm that <b style="color:var(--ink)">${esc(S.verify)}</b> is yours. We've sent a link to that inbox. Open it, then come back and press the button below.</p><div class="tools" style="margin-top:14px"><button class="btn btn-dark" id="vfDone">I've confirmed it</button><button class="btn btn-ghost" id="vfResend">Send the link again</button><button class="btn btn-ghost" id="vfOut">Sign out</button></div><div class="err" id="vfMsg" style="margin-top:10px"></div></section></div>`}
function authMsg(c){c=c||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'That email and password don\'t match an account. Check them, or ask an admin to create your account.';
  if(/too-many-requests/.test(c))return 'Too many attempts. Wait a few minutes and try again.';
  if(/popup-closed|cancelled-popup/.test(c))return '';
  if(/popup-blocked/.test(c))return 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.';
  if(/unauthorized-domain/.test(c))return 'This web address isn\'t allowed to sign in yet. In Firebase, add it under Authentication > Settings > Authorized domains.';
  if(/operation-not-allowed/.test(c))return 'This sign-in method is switched off in Firebase (Authentication > Sign-in method).';
  if(/network/.test(c))return 'No internet connection. Check your connection and try again.';
  return 'Sign-in failed ('+c+').';}
function signInView(){return `<div style="max-width:420px;margin:40px auto"><section class="card rv" style="padding:26px"><div class="dhead" style="margin-bottom:18px"><span class="brand-mark" style="width:44px;height:44px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M3 12 12 4l9 8"/></svg></span><div><h3 style="margin:0;font-size:20px">Sign in</h3><div class="muted">Vestates tenant registry · team members only</div></div></div>
<button class="btn btn-dark" id="siGoogle" style="width:100%;padding:11px"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>Continue with Google</button>
<div class="muted" style="text-align:center;margin:14px 0">or with email</div>
<form id="signin" class="fields" style="grid-template-columns:1fr" novalidate><label class="field">Email<input id="siEmail" type="email" autocomplete="username" required></label><label class="field">Password<input id="siPass" type="password" autocomplete="current-password" required></label><div class="err" id="siErr"></div><button class="btn btn-ghost" type="submit" id="siBtn">Sign in</button><span class="tools" style="justify-content:space-between"><button type="button" class="copy" id="siReset">Forgot your password?</button><span class="muted">Same account as the lease dashboard</span></span></form></section></div>`}
function emptyView(){return head('Tenant registry','No tenants recorded yet.')+`<section class="card"><div class="empty"><b style="color:var(--ink)">The registry is empty.</b><br>Add your first tenant and it will appear here for everyone with access.<br><br><span class="tools" style="justify-content:center"><button class="btn btn-dark w-only" data-new="1"><i data-lucide="user-plus"></i>Add tenant</button></span></div></section>`}

function stats(){
  const R=S.rows,occ=R.filter(r=>r.status==='occupied'),managed=R.filter(r=>r.status!=='not_managed');
  const vac=R.filter(r=>r.status==='vacant'||r.status==='vacated');
  const roll=occ.reduce((a,r)=>a+annual(r),0),sc=occ.reduce((a,r)=>a+annualSc(r),0);
  const bk={};BUCKETS.forEach(([k])=>bk[k]=occ.filter(r=>bucket(r)===k));
  return {R,occ,managed,vac,roll,sc,bk,rate:managed.length?occ.length/managed.length:0};
}

function mat(T,col,opts){return new T.MeshStandardMaterial(Object.assign({color:new T.Color(col),roughness:.45,metalness:.08},opts||{}))}

  const dark=curTheme()==='dark';
  const ground=new T.Mesh(new T.CylinderGeometry(19,19.6,0.6,96),mat(T,dark?'#161A21':'#F6F7FA',{roughness:.95}));

  const n=facs.length,cols=Math.ceil(Math.sqrt(n)),gap=7.2;
  const glass=dark?'#3A4354':'#D6DCE6',amber=css('--amber')||'#E0A21B',nm=dark?'#2A2F38':'#AEB5C2';

  const slots=[];for(let i=0;i<cols;i++)for(let j=0;j<Math.ceil(n/cols);j++)slots.push({x:(i-(cols-1)/2)*gap,z:(j-(Math.ceil(n/cols)-1)/2)*gap});
  slots.sort((a,b)=>(a.x*a.x+a.z*a.z)-(b.x*b.x+b.z*b.z));

    const base=new T.Mesh(new T.BoxGeometry(4.2,0.25,4.2),mat(T,dark?'#232833':'#E3E7EE',{roughness:.9}));base.position.y=0.125;base.receiveShadow=true;g.add(base);
    const fh=0.62;

function resize3D(){const host=G.r.domElement.parentNode;if(!host)return;const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;G.r.setSize(w,h,false);G.cam.aspect=w/h;

function loop3D(t){

/* ---------- data ---------- */
async function writeDoc(id,data){
  if(!DB){lastErr='Not connected to the shared data.';return false}
  writing++;lastErr='';setSync();
  const ref=DB.collection(COL_T).doc(id);
  let ok=false;
  for(let i=0;i<2;i++){
    try{await (data?ref.set(data):ref.delete());ok=true;break}
    catch(e){const c=e&&e.code;
      if(c==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,600+Math.random()*800));continue}
      lastErr=(c==='invalid_argument'||c==='permission-denied')?'You have view-only access, so this was not saved.':c==='quota_exceeded'?'The registry database is full. Delete old records first.':'Could not save. Check your connection and try again.';
      if(c==='invalid_argument'||c==='permission-denied'){S.canWrite=false;document.body.classList.add('ro')}
      break}
  }
  writing--;setSync();return ok;
}
async function setRenewal(id,v){const t=S.rows.find(r=>r.id===id);if(!t)return;const o=Object.assign({},t);o.renewal=v;if(await writeDoc(id,o))toast(v?`${tenantName(t)}: ${v}`:'Renewal reset')}
async function vacate(id){const t=S.rows.find(r=>r.id===id);if(!t)return;const o=Object.assign({},t);o.status='vacated';o.vacatedOn=new Date().toISOString().slice(0,10);if(await writeDoc(id,o))toast(`${unitName(t)} at ${facName(t.property)} marked vacated`)}
function csv(){
  const cols=['property','unit','tenant','org','type','group','phone','email','status','billing','start','end','rent','sc','annual_rent','currency','fxRent','fxSc','renewal','vacatedOn','note'];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [cols.join(',')].concat(filteredOrAll().map(t=>cols.map(c=>q(c==='annual_rent'?Math.round(annual(t)):t[c])).join(','))).join('\n');
}
function filteredOrAll(){return S.page==='tenants'?filtered():S.rows}
async function exportCsv(){
  if(!S.rows.length){toast('Nothing to export yet');return}
  const name=`vestates-tenants-${new Date().toISOString().slice(0,10)}.csv`;
  if(!DL){const b=new Blob([csv()],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Export downloaded');return}
  try{await DL.save({filename:name,data:csv()});toast('Export ready')}catch(e){if(e&&e.code!=='declined')toast('Could not create the file. Try again.')}
}
function connect(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){connectFirebase();return}
  c.use('db').then(db=>{
    if(!db){S.offline=true;setSync();render();return}
    DB=db;
    db.doc('config/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.props=(d.properties||[]).slice();S.colors=Object.assign({},d.propColors||{});S.loaded.c=true;rerender()},()=>{});
    db.collection('tenants').onSnapshot(s=>{S.rows=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));const first=!S.loaded.t;S.loaded.t=true;setSync();if(first){S.animate=true;render()}else rerender()},
      e=>{lastErr='Live updates stopped. Reload the page.';setSync()});
  },()=>{S.offline=true;setSync();render()});
  c.use('user').then(u=>{if(!u)return;
    u.can('data.write').then(w=>{if(w===false){S.canWrite=false;document.body.classList.add('ro');setSync();rerender()}});
    u.me&&u.me().then(m=>{if(m&&m.name){$('#meName').textContent=m.name;$('#meAv').textContent=ini(m.name)}}).catch(()=>{});
  });
  c.use('downloads').then(d=>{DL=d});
  setTimeout(()=>{if(!DB&&!S.offline){S.offline=true;setSync();render()}},11000);
}


/* ---------- Firebase mode (GitHub Pages) ---------- */
function connectFirebase(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){S.offline=true;S.offlineMsg='Add your Firebase settings at the top of index.html, then reload.';setSync();render();return}
  FB=true;COL_T='units';DOC_C='config/main';
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){}
  const auth=firebase.auth();
  auth.onAuthStateChanged(u=>{
    UNSUB.forEach(f=>{try{f()}catch(_){}});UNSUB=[];
    if(!u){S.verify=false;S.needAuth=true;S.loaded.t=false;S.rows=[];DB=null;$('#btnSignOut').hidden=true;setSync();S.animate=true;render();return}
    S.needAuth=false;S.offline=false;$('#btnSignOut').hidden=false;
    const nm=u.displayName||u.email||'Signed in';$('#meName').textContent=nm;$('#meAv').textContent=ini(nm);
    DB=firebase.firestore();
    S.canWrite=true;document.body.classList.remove('ro');
    S.verify=false;if(!u.emailVerified){S.verify=u.email;u.sendEmailVerification().catch(()=>{});setSync();S.animate=true;render();return}
    DB.collection('members').doc(String(u.email).toLowerCase()).get().then(d=>{
      if(!d.exists){S.offline=true;S.offlineMsg=u.email+' is not on the team list. Ask an admin to add you in the lease dashboard.';setSync();render();return}
      const m=d.data()||{};if(m.name){$('#meName').textContent=m.name;$('#meAv').textContent=ini(m.name)}
      if(!['editor','admin'].includes(m.role)){S.canWrite=false;document.body.classList.add('ro');setSync();rerender()}
    }).catch(()=>{});
    UNSUB.push(DB.doc(DOC_C).onSnapshot(s=>{const d=s.exists?s.data():{};S.props=(d.properties||[]).slice();S.colors=Object.assign({},d.propColors||{});S.loaded.c=true;rerender()},()=>{}));
    UNSUB.push(DB.collection(COL_T).onSnapshot(s=>{S.rows=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));const first=!S.loaded.t;S.loaded.t=true;setSync();if(first){S.animate=true;render()}else rerender()},
      e=>{if(e&&e.code==='permission-denied'){S.offline=true;S.offlineMsg='Your account is not on the team list. Ask an admin to add you in the lease dashboard.'}else lastErr='Live updates stopped. Reload the page.';setSync();render()}));
  });
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='signin')return;e.preventDefault();
  const em=$('#siEmail').value.trim(),pw=$('#siPass').value,err=$('#siErr'),b=$('#siBtn');
  err.style.color='';
  if(!em||!pw){err.textContent='Enter your email and password.';return}
  b.disabled=true;b.textContent='Signing in…';err.textContent='';
  try{await firebase.auth().signInWithEmailAndPassword(em,pw)}catch(x){err.textContent=authMsg(x&&x.code);b.disabled=false;b.textContent='Sign in'}
});
document.addEventListener('click',async e=>{
  const t=e.target.closest('#siGoogle,#siReset,#vfDone,#vfResend,#vfOut');if(!t)return;
  const A=firebase.auth();
  if(t.id==='siGoogle'){try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await A.signInWithPopup(p)}catch(x){const er=$('#siErr');if(er)er.textContent=authMsg(x&&x.code)}}
  if(t.id==='siReset'){const em=$('#siEmail').value.trim(),er=$('#siErr');if(!em){er.style.color='';er.textContent='Type your email address above first.';return}
    try{await A.sendPasswordResetEmail(em);er.style.color='var(--good)';er.textContent='If that address has an account, a reset link is on its way.'}catch(x){er.style.color='';er.textContent=authMsg(x&&x.code)}}
  if(t.id==='vfDone'){const u=A.currentUser,m=$('#vfMsg');if(!u)return;await u.reload();await u.getIdToken(true);if(A.currentUser&&A.currentUser.emailVerified)location.reload();else m.textContent='Not confirmed yet. Open the link in the email first (check spam too).'}
  if(t.id==='vfResend'){const m=$('#vfMsg');try{await A.currentUser.sendEmailVerification();m.style.color='var(--good)';m.textContent='Sent. Check your inbox and spam folder.'}catch(x){m.style.color='';m.textContent=authMsg(x&&x.code)}}
  if(t.id==='vfOut')A.signOut();
});
document.addEventListener('click',e=>{if(e.target.closest('#btnSignOut')&&FB){firebase.auth().signOut();toast('Signed out')}});
document.addEventListener('change',async e=>{
  if(e.target.id!=='importFile'||!DB)return;
  const f=e.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text()),rows=Array.isArray(j)?j:(j.tenants||[]);
    if(!rows.length){toast('No tenants found in that file');return}
    toast('Importing '+rows.length+' records…');
    for(let i=0;i<rows.length;i+=400){const b=DB.batch();rows.slice(i,i+400).forEach(r=>{const id=String(r.id||('t'+Math.random().toString(36).slice(2,10)));b.set(DB.collection(COL_T).doc(id),Object.assign({},r,{id}))});await b.commit()}
    if(j.config)await DB.doc(DOC_C).set(j.config);
    toast('Imported '+rows.length+' tenant records');
  }catch(x){toast(x&&x.code==='permission-denied'?'Your account cannot write to the registry.':'That file could not be imported. Use the tenants.json export.')}
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){e.stopPropagation();const v=cp.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied '+v),()=>toast(v));return}
  const t=e.target.closest('button,[data-open],[data-fac],select');
  if(!t){if(!e.target.closest('.pop'))$('#popHost').innerHTML='';return}
  if(t.tagName==='SELECT')return;
  if(!t.closest('.pop')&&t.id!=='btnBell')$('#popHost').innerHTML='';
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.themeSet){setTheme(t.dataset.themeSet);return}
  if(t.id==='btnTheme2'){setTheme(curTheme()==='dark'?'light':'dark');return}
  if(t.id==='btnBell'){togglePop();return}
  if(t.id==='btnSearch'){S.page!=='tenants'&&go('tenants');setTimeout(()=>{const q=$('#q');q&&q.focus()},300);return}
  if(t.id==='btnExport'||t.id==='btnExport2'||t.id==='btnExport3'){exportCsv();return}
  if(t.dataset.new){if(!S.canWrite){toast('You have view-only access');return}openDrawer(null);return}
  if(t.dataset.vacate){e.stopPropagation();if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='Tap to confirm';return}vacate(t.dataset.vacate);return}
  if(t.dataset.open){openDrawer(t.dataset.open);return}
  if(t.dataset.fac!=null){S.fac=t.dataset.fac;S.st='all';S.ty='all';S.bucket='all';S.q='';go('tenants');return}
  if(t.dataset.bucket){S.bucket=t.dataset.bucket;if(t.dataset.bucket!=='all'){S.st='all';S.fac='all';S.ty='all';S.q='';go('tenants')}else rerender();return}
  if(t.dataset.filter){const [k,v]=t.dataset.filter.split(':');S.st=v;S.fac='all';S.ty='all';S.bucket='all';S.q='';go('tenants');return}
  if(t.dataset.st){S.st=t.dataset.st;rerender();return}
  if(t.dataset.view){S.view=t.dataset.view;try{localStorage.setItem('vtr-view',S.view)}catch(_){}S.animate=true;render();return}
  if(t.id==='clearF'){S.q='';S.fac='all';S.ty='all';S.st='all';S.bucket='all';rerender();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modalHost').innerHTML){$('#modalHost').innerHTML='';if(pendingRender){pendingRender=false;rerender()}}$('#popHost').innerHTML=''}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-open],[data-fac]')&&e.target.tagName!=='BUTTON')e.target.click();
});
let qT;
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;clearTimeout(qT);qT=setTimeout(rerender,120)}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='facSel'){S.fac=t.value;rerender()}
  if(t.id==='tySel'){S.ty=t.value;rerender()}
  if(t.dataset.renew){setRenewal(t.dataset.renew,t.value)}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!$('#modalHost').innerHTML){const a=document.activeElement;if(!(a&&$('#view').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){pendingRender=false;rerender()}}},50)});

/* theme */
function curTheme(){const a=document.documentElement.dataset.theme;return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('vtr-theme',t)}catch(e){}markTheme()}
function markTheme(){const t=curTheme();document.querySelectorAll('[data-theme-set]').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===t));if(G&&S.loaded.t)mount3D()}

/* boot */
try{const t=localStorage.getItem('vtr-theme');if(t)document.documentElement.dataset.theme=t;const v=localStorage.getItem('vtr-view');if(v)S.view=v}catch(e){}
buildNav();icons();markTheme();setSync();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',markTheme);
const h=(location.hash||'').slice(1);
go(VIEWS[h]?h:'overview',{noScroll:true});
addEventListener('resize',moveInd);
document.fonts&&document.fonts.ready.then(moveInd);
connect();
})();
</script>
